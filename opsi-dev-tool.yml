project:
  name: opsi-configed
  summary: opsi-configed management interface
  description: opsi-configed management interface for the client management system
    opsi
  homepage: https://www.opsi.org
  maintainer: uib GmbH info@uib.de
  licenses:
    - license: AGPL-3.0
  version: "4.3.12.4"
  version_files:
    pom.xml: '/project/version' # will update the version in pom.xml
  changelog_filename: CHANGELOG.md # will be used as default changelog file. This file is prioritized over the public commit messages.
  changelog_ignore_versions: "4\\.4\\.0\\.(1[0-4]|[1-9])"
  date_files:
    src/main/java/de/uib/configed/gui/Globals.java: VERDATE;%Y-%m-%d # the variable VERDATE will be replaced with the current date

