# Set DEPENDENCY_UPDATE_ONLY=true on the schedule targeting a protected ref.
include:
  - local: .gitlab/ci/dependency-updates.yml
    rules:
      - if: &dependency_update_schedule '$CI_PIPELINE_SOURCE == "schedule" && $DEPENDENCY_UPDATE_ONLY == "true"'

  - local: .gitlab/ci/build.yml
    rules:
      - if: *dependency_update_schedule
        when: never
      - when: always
