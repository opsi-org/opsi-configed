# Target a protected ref in the schedule so the job can access GITLAB_TOKEN.
include:
  - local: .gitlab/ci/dependency-updates.yml
    rules:
      - if: &scheduled_pipeline '$CI_PIPELINE_SOURCE == "schedule"'

  - local: .gitlab/ci/build.yml
    rules:
      - if: *scheduled_pipeline
        when: never
      - when: always
